server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers are set once at server level. Locations below deliberately
    # use `expires` rather than `add_header` so these are inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Text assets compress well; the 11 MB WASM binaries are left uncompressed
    # to avoid per-request compression CPU on school laptops.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite output is immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Self-hosted MediaPipe model and runtime.
    location /models/ {
        try_files $uri =404;
        expires 7d;
    }

    location /mediapipe/ {
        try_files $uri =404;
        expires 7d;
    }

    # Explicit WASM MIME type regardless of the base image's mime.types.
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
        expires 7d;
    }

    # SPA fallback. index.html must never be cached at the edge.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
